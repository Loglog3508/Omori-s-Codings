<script>
// 背景视频加载回退逻辑（超时移除）
(function initBgVideo(){
  const v=document.getElementById('bg-video');
  if(!v) return;
  let loaded=false;
  const timeout=setTimeout(()=>{
    if(!loaded){ v.parentElement && v.parentElement.removeChild(v); console.warn('[BGVideo] 加载超时，已移除 video'); }
  },12000);
  v.addEventListener('canplay',()=>{ loaded=true; clearTimeout(timeout); v.classList.add('bg-video-ready'); },{once:true});
  v.addEventListener('error',()=>{ clearTimeout(timeout); if(v.parentElement){ v.parentElement.removeChild(v); console.warn('[BGVideo] 加载失败，移除 video'); } });
  window.toggleBgVideo=()=>{ if(!v) return; if(v.paused){ v.play(); } else { v.pause(); } };
})();

// 轻量粒子占位：简单移动小圆点（避免引入大型库）
(function simpleParticles(){
  const canvas=document.getElementById('particle-canvas');
  if(!canvas || !canvas.getContext) return;
  const ctx=canvas.getContext('2d');
  let w,h,particles=[];
  function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
  function init(){ resize(); particles=[]; for(let i=0;i<60;i++){ particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+0.4, vx:(Math.random()-0.5)*0.2, vy:(Math.random()-0.5)*0.2, alpha:0.6+Math.random()*0.4}); } }
  function step(){ ctx.clearRect(0,0,w,h); for(const p of particles){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1; ctx.beginPath(); ctx.fillStyle='rgba(173,228,255,'+p.alpha+')'; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); } requestAnimationFrame(step); }
  window.addEventListener('resize', ()=>{ resize(); });
  init(); step();
})();

    { type:'塑料污染 (Plastic Debris)', desc:'宏观与微塑料进入海洋，影响生态链并可吸附有害化学物。', strategies:['源头减量','生产者延伸责任 (EPR)','循环回收体系','河口 & 入海口拦截','海滩 / 离岸清理','可降解 / 替代材料','公众教育'] },

    { type:'重金属 (Heavy Metals)', desc:'来自采矿、工业排放与沉积再悬浮，易生物累积。', strategies:['源头清洁生产','排放标准 & 监测','受污染沉积物治理 (固化/疏浚)','风险分级管理','土壤—河流协同治理'] },
    { type:'持久性有机污染物 POPs', desc:'难降解、有毒、生物富集，跨界迁移。', strategies:['淘汰 / 替代化学品','封闭式工艺改造','国际公约协同 (斯德哥尔摩等)','监测溯源','安全处置与回收'] },
    { type:'噪声污染 (Underwater Noise)', desc:'航运、地震勘测、施工影响海洋生物通讯与行为。', strategies:['安静船舶设计','航速优化与航线调整','施工时段避让敏感季','缓冲区划定','实时声学监测'] },
    { type:'海洋酸化 (Ocean Acidification)', desc:'CO₂ 吸收导致 pH 下降，影响碳酸钙生物。', strategies:['减排 (能源转型)','蓝碳生态保护 (红树林/海草)','局地缓冲 (部分养殖场)','增强监测网络','与气候政策协同'] },
    { type:'海洋热浪 (Marine Heatwaves)', desc:'异常高温事件损伤珊瑚与生态系统。', strategies:['全球温室气体减排','早期预警系统','生态多样性缓冲','受影响区域临时保护','动态海洋管理'] },
    { type:'外来入侵物种 (Invasive Species)', desc:'压舱水 / 船体附着传播，扰乱本地生态。', strategies:['压舱水处理系统','船体防污涂层优化','高风险港口监测','快速清除与生物安全计划','生物风险评估'] }
  ];

  const btn = document.getElementById('pollutionQueryBtn');
  const modal = document.getElementById('pollutionQueryModal');
  const closeBtn = document.getElementById('pollutionModalClose');
  const searchInput = document.getElementById('pollutionSearch');
  const filterSelect = document.getElementById('pollutionFilter');
  const listEl = document.getElementById('pollutionResultList');
  const countEl = document.getElementById('resultCount');
  const noResultEl = document.getElementById('noResult');
  let lastFocus = null;

  function escapeHTML(str){ return str.replace(/[&<>\"]+/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[s])); }
  function highlight(text, term){
    if(!term) return escapeHTML(text);
    try{
      const re=new RegExp('(' + term.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&') + ')','ig');
      return escapeHTML(text).replace(re,'<mark>$1</mark>');
    }catch{ return escapeHTML(text); }
  }

  function render(term=''){ const scope = filterSelect.value; const kw = term.trim(); let results = DATA.filter(row=>{ if(!kw) return true; const t = kw.toLowerCase(); if(scope==='type') return row.type.toLowerCase().includes(t); if(scope==='strategy') return row.strategies.some(s=>s.toLowerCase().includes(t)); return (row.type+row.desc+row.strategies.join(',')).toLowerCase().includes(t); }); listEl.innerHTML=''; if(!results.length){ noResultEl.classList.remove('hidden'); countEl.textContent='0'; return; } noResultEl.classList.add('hidden'); results.forEach(row=>{ const li=document.createElement('li'); li.className='pollution-item'; li.innerHTML = '<div class="pi-type">'+highlight(row.type, kw)+'</div>'+
      '<div class="pi-desc">'+highlight(row.desc, kw)+'</div>'+
      '<div class="pi-strat-label">治理策略:</div>'+
      '<ul class="pi-strategies">'+ row.strategies.map(s=>'<li>'+highlight(s, kw)+'</li>').join('') +'</ul>';
      listEl.appendChild(li); }); countEl.textContent=results.length; }

  function openModal(){ if(!modal.classList.contains('hidden')) return; lastFocus = document.activeElement; modal.classList.remove('hidden'); document.body.classList.add('modal-open'); setTimeout(()=>modal.classList.add('show'),10); render(searchInput.value); searchInput.focus({preventScroll:true}); }
  function closeModal(){ if(modal.classList.contains('hidden')) return; modal.classList.remove('show'); setTimeout(()=>{ modal.classList.add('hidden'); document.body.classList.remove('modal-open'); lastFocus && lastFocus.focus(); },180); }

  window.__HELP_POLLUTION_DATA__ = DATA;
})();

// ================= 搜索核心逻辑 (智能联想 + 自动抓取) =================
(function initSmartSearch(){
  const input = document.getElementById('mainSearchInput');
  const dropdown = document.getElementById('helpSearchDropdown');
  if(!input || !dropdown) return;

  let debounceTimer = null;
  let currentQuery = '';
  
  // 1. 监听输入 - 触发联想
  input.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      currentQuery = val;
      if(debounceTimer) clearTimeout(debounceTimer);
      
      if(!val) {
          dropdown.innerHTML = '';
          dropdown.classList.add('hidden');
          return;
      }

      // 300ms 防抖，避免请求过于频繁
      debounceTimer = setTimeout(() => {
          fetchSuggestions(val);
      }, 300);
  });
  
  // 2. 监听回车 - 触发重度搜索/抓取
  input.addEventListener('keypress', (e) => {
      if(e.key === 'Enter' && currentQuery) {
          performSearch(currentQuery);
      }
  });

  // 获取联想词 (Baidu JSONP)
  function fetchSuggestions(kw) {
      const cbName = 'baidu_sug_cb_' + Date.now();
      window[cbName] = (data) => {
          renderDropdown(data.s, kw);
          delete window[cbName];
          document.body.removeChild(script);
      };

      const script = document.createElement('script');
      script.src = `https://sp0.baidu.com/5a1Fazu8AA54nxGko9WTAnF6hhy/su?wd=${encodeURIComponent(kw)}&cb=${cbName}`;
      script.onerror = () => {
          // 失败时仅显示本地匹配
          renderDropdown([], kw); 
          delete window[cbName];
          if(script.parentNode) document.body.removeChild(script);
      };
      document.body.appendChild(script);
  }

  // 渲染下拉菜单
  function renderDropdown(suggestions, kw) {
      dropdown.innerHTML = '';
      
      // A. 本地数据匹配 (优先显示)
      const localMatches = (window.__HELP_POLLUTION_DATA__ || []).filter(item => 
          item.type.includes(kw) || item.desc.includes(kw) || item.strategies.some(s=>s.includes(kw))
      );
      
      if(localMatches.length > 0) {
          const groupHeader = document.createElement('div');
          groupHeader.className = 'dd-group-title';
          groupHeader.textContent = '本地知识库';
          groupHeader.style.cssText = 'font-size:12px;color:#4cc9f0;padding:4px 10px;background:rgba(255,255,255,0.05);';
          dropdown.appendChild(groupHeader);
          
          localMatches.forEach(item => {
              const div = document.createElement('div');
              div.className = 'dd-item';
              div.innerHTML = `<span class="dd-text" style="color:#fff;">${item.type.split('(')[0]}</span> <span style="font-size:11px;color:#888;">- 本地数据</span>`;
              div.onclick = () => {
                  // 滚动到对应卡片并高亮
                  highlightLocalCard(item.title || item.type);
                  dropdown.classList.add('hidden');
              };
              dropdown.appendChild(div);
          });
      }

      // B. 网络联想词
      if(suggestions && suggestions.length > 0) {
           const groupHeader = document.createElement('div');
           groupHeader.className = 'dd-group-title';
           groupHeader.textContent = '网络联想 (点击抓取解释)';
           groupHeader.style.cssText = 'font-size:12px;color:#F5D061;padding:4px 10px;background:rgba(255,255,255,0.05);margin-top:4px;';
           dropdown.appendChild(groupHeader);

           suggestions.slice(0, 6).forEach(s => {
               const div = document.createElement('div');
               div.className = 'dd-item external';
               div.innerHTML = `<span class="dd-text">${s}</span>`;
               div.onclick = () => {
                   input.value = s;
                   performSearch(s); // 点击即抓取
               };
               dropdown.appendChild(div);
           });
      }
      
      // C. 兜底选项：直接搜索当前词
      if(localMatches.length === 0 && (!suggestions || suggestions.length === 0)) {
           const div = document.createElement('div');
           div.className = 'dd-item external';
           div.innerHTML = `<span class="dd-text">🔍 联网搜索解释: "<b>${kw}</b>"</span>`;
           div.onclick = () => performSearch(kw);
           dropdown.appendChild(div);
      }

      dropdown.classList.remove('hidden');
  }

  // 执行核心搜索 (含智能抓取 - 升级版)
  async function performSearch(queryTerm) {
      dropdown.classList.remove('hidden');
      dropdown.innerHTML = `<div class="dd-item" style="cursor:wait;justify-content:center;padding:20px;"><div style="text-align:center;"><div style="font-size:16px;margin-bottom:8px;">🔄</div><div style="font-size:12px;color:#88beec;">正在联网检索: "${queryTerm}"...</div></div></div>`;
      
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000); 

      try {
          const isComplexQuery = queryTerm.length > 4 && (queryTerm.includes('吗') || queryTerm.includes('为什么') || queryTerm.includes('能') || queryTerm.includes('?'));
          let success = false;
          let resultData = null;

          /* 1. 尝试网络搜索 (Local Proxy) */
          const searchUrl = 'https://www.baidu.com/s?wd=' + encodeURIComponent(queryTerm);
          const proxySearchUrl = '/api/proxy?url=' + encodeURIComponent(searchUrl);
          
          try {
              const res = await fetch(proxySearchUrl, { signal: controller.signal });
              if(res.ok) {
                  const html = await res.text();
                  const parser = new DOMParser();
                  const doc = parser.parseFromString(html, 'text/html');
                  
                  /* 尝试提取精选摘要 */
                  const bestAnswer = doc.querySelector('.op_best_answer_question') || doc.querySelector('.c-abstract') || doc.querySelector('.c-container .c-abstract') || doc.querySelector('.wa-oa-wiki-lemma-content');
                                   
                  if (bestAnswer && bestAnswer.innerText.length > 20) {
                      let text = bestAnswer.innerText.trim();
                      text = text.replace(/^\d{4}年\d{1,2}月\d{1,2}日\s*-\s*/, ''); 
                      resultData = { type: 'web', title: '网络搜索结果', content: text, url: searchUrl };
                      success = true;
                  }
              }
          } catch(err) {
              console.warn("Web Search parse failed", err);
          }

          /* 2. 回退到百科抓取 */
          if (!success) {
               const wikiUrl = 'https://baike.baidu.com/item/' + encodeURIComponent(queryTerm);
               const proxyWikiUrl = '/api/proxy?url=' + encodeURIComponent(wikiUrl);
               
               const res2 = await fetch(proxyWikiUrl, { signal: controller.signal });
               if(res2.ok) {
                   const html2 = await res2.text();
                   const doc2 = new DOMParser().parseFromString(html2, 'text/html');
                   const summaryEl = doc2.querySelector('.lemma-summary') || doc2.querySelector('.summary-content') || doc2.querySelector('meta[name="description"]');
                   
                   if (summaryEl) {
                       let content = summaryEl.tagName === 'META' ? summaryEl.content : summaryEl.innerText;
                       content = content.replace(/\[\d+\]/g, '').trim();
                       if(content.length > 10) {
                           resultData = { type: 'wiki', title: '百科知识库', content: content, url: wikiUrl };
                           success = true;
                       }
                   }
               }
          }

          clearTimeout(timeoutId);

          if (success && resultData) {
              const displayContent = resultData.content.length > 400 ? resultData.content.substring(0, 400) + '...' : resultData.content;

              dropdown.innerHTML = `
                  <div class="dd-item expanded" style="background:rgba(2,25,40,0.95); border:1px solid #4cc9f0; cursor:default; display:block; padding:15px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;">
                           <div style="font-size:14px; color:#F5D061; font-weight:bold;">🚀 ${resultData.title}: ${queryTerm}</div>
                           <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.1);color:#888;">AI/WEB FETCH</span>
                      </div>
                      <div style="font-size:14px; color:#e0fbfc; line-height:1.7; white-space:normal; max-height:300px; overflow-y:auto; padding-right:5px; text-align:justify;">${displayContent}</div>
                      <div style="margin-top:12px;display:flex;justify-content:flex-end;">
                           <a href="${resultData.url}" target="_blank" style="font-size:12px; color:#4cc9f0; text-decoration:none; display:flex; align-items:center; background:rgba(76,201,240,0.1); padding:4px 10px; border-radius:4px;">查看来源网页 -></a>
                      </div>
                  </div>
              `;
          } else {
              throw new Error('No valid summary found');
          }

      } catch(e) {
          console.warn('Search failed:', e);
          dropdown.innerHTML = `<div class="dd-item" style="color:#ff9999; padding:15px; text-align:center;"><div style="font-size:24px;margin-bottom:8px;">😕</div><div>抱歉，自动抓取未能提取有效答案。</div><a href="https://www.baidu.com/s?wd=${encodeURIComponent(queryTerm)}" target="_blank" style="color:#F5D061;text-decoration:underline;">点击此处跳转百度搜索 &gt;</a></div>`;
      }
  }

  // 辅助：高亮本地卡片
  function highlightLocalCard(text) {
      // 简单匹配 title
      const cards = document.querySelectorAll('.info-card');
      let found = false;
      cards.forEach(card => {
          if(card.innerText.includes(text)) {
              card.scrollIntoView({behavior:'smooth', block:'center'});
              card.style.transition = '0.5s';
              card.style.borderColor = '#F5D061';
              card.style.boxShadow = '0 0 20px rgba(245, 208, 97, 0.4)';
              setTimeout(() => {
                  card.style.borderColor = '';
                  card.style.boxShadow = '';
              }, 2000);
              found = true;
          }
      });
  }

  // 点击外部关闭下拉
  document.addEventListener('click', (e) => {
      if(!e.target.closest('.search-container')) {
          dropdown.classList.add('hidden');
      }
  });

})();

</script>

<script>
(function initPollutionSidebar(){
  const sidebar = document.getElementById('pollutionSidebar');
  const list = document.getElementById('pollutionList');
  const toggle = document.getElementById('psToggle');
  
  // Toggle Logic
  toggle.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    const isCollapsed = sidebar.classList.contains('collapsed');
    toggle.innerHTML = isCollapsed 
      ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>'
      : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
  });

  // Populate Data
  function render(){
    const data = window.__HELP_POLLUTION_DATA__;
    if(!data || !data.length) {
      // Retry if data not ready
      setTimeout(render, 100);
      return;
    }
    
    list.innerHTML = data.map(item => `
      <div class="ps-item">
        <div class="ps-title">${item.type.split('(')[0]}</div>
        <div class="ps-desc">${item.desc}</div>
        <div class="ps-tags">
          ${item.strategies.slice(0,3).map(s => `<span class="ps-tag">${s}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }
  
  // Initial render attempt
  render();
})();
</script>
