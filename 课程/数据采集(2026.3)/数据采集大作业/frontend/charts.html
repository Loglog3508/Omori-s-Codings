<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大连市近10年天气数据分析 · 趋势分析</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  </head>
  <body>
    <nav class="floating-nav" aria-label="页面导航">
      <a href="./index.html"><span class="nav-icon">总</span><span class="nav-text">总览</span></a>
      <a class="active" href="./charts.html"><span class="nav-icon">趋</span><span class="nav-text">趋势</span></a>
      <a href="./records.html"><span class="nav-icon">明</span><span class="nav-text">明细</span></a>
      <a href="./weather.html"><span class="nav-icon">天</span><span class="nav-text">天气</span></a>
      <a href="./source.html"><span class="nav-icon">数</span><span class="nav-text">数据</span></a>
    </nav>

    <header class="topbar">
      <div>
        <h1>气温、降水与极端天气趋势</h1>
        <p id="sourceNote">正在加载数据...</p>
      </div>
      <div class="top-actions">
        <a class="secondary-link" href="./records.html">查看明细</a>
      </div>
    </header>

    <main>
      <section class="chart-grid" aria-label="图表区">
        <div class="panel wide"><h2>年均气温趋势</h2><div id="yearTempChart" class="chart"></div></div>
        <div class="panel wide"><h2>月均气温与降水</h2><div id="monthlyTrendChart" class="chart"></div></div>
        <div class="panel wide"><h2>年降水量</h2><div id="yearRainChart" class="chart"></div></div>
        <div class="panel wide chart-contained"><h2>季节平均气温</h2><div id="seasonTempChart" class="chart"></div></div>
        <div class="panel wide chart-contained"><h2>季节降水量</h2><div id="seasonRainChart" class="chart"></div></div>
        <div class="panel wide"><h2>极端天气日统计</h2><div id="extremeChart" class="chart"></div></div>
      </section>
    </main>

    <script src="./data/weather_data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
