<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大连市近10年天气数据分析 · 总览</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  </head>
  <body>
    <nav class="floating-nav" aria-label="页面导航">
      <a class="active" href="./index.html"><span class="nav-icon">总</span><span class="nav-text">总览</span></a>
      <a href="./charts.html"><span class="nav-icon">趋</span><span class="nav-text">趋势</span></a>
      <a href="./records.html"><span class="nav-icon">明</span><span class="nav-text">明细</span></a>
      <a href="./weather.html"><span class="nav-icon">天</span><span class="nav-text">天气</span></a>
      <a href="./source.html"><span class="nav-icon">数</span><span class="nav-text">数据</span></a>
    </nav>

    <header class="topbar">
      <div>
        <h1>大连市近10年天气数据分析</h1>
        <p id="sourceNote">正在加载数据...</p>
      </div>
      <div class="top-actions">
        <a class="primary-link" href="./charts.html">查看趋势</a>
      </div>
    </header>

    <main>
      <section class="metrics" aria-label="核心指标">
        <article><span>样本天数</span><strong id="totalDays">0</strong></article>
        <article><span>平均气温</span><strong id="avgTemp">0°C</strong></article>
        <article><span>累计降水</span><strong id="totalRain">0mm</strong></article>
        <article><span>极端天气日</span><strong id="extremeDays">0</strong></article>
      </section>

      <section class="insight-grid" id="insightList" aria-label="天气摘要"></section>

      <section class="chart-grid compact" aria-label="总览图表">
        <div class="panel wide"><h2>年均气温趋势</h2><div id="yearTempChart" class="chart"></div></div>
        <div class="panel wide"><h2>天气类型占比</h2><div id="weatherChart" class="chart"></div></div>
        <div class="panel full chart-contained"><h2>季节平均气温</h2><div id="seasonTempChart" class="chart"></div></div>
      </section>
    </main>

    <script src="./data/weather_data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
